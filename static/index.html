<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmácia Popular - Portal</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-success">
    <div class="container">
      <span class="navbar-brand">💊 Farmácia Popular</span>
      <div class="navbar-nav">
        <a class="nav-link active" href="/">Portal</a>
        <a class="nav-link" href="/painel">Painel</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 760px;">
    <h1 class="h4 mb-3">Pegar remédio</h1>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="formSenha">
          <div class="mb-3">
            <label class="form-label">Seu nome</label>
            <input id="campoNome" type="text" class="form-control" placeholder="Nome completo" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Remédio</label>
            <select id="campoRemedio" class="form-select" required></select>
          </div>
          <button type="submit" class="btn btn-success w-100">Tirar senha</button>
        </form>

        <div id="erro" class="alert alert-danger mt-3 mb-0 d-none"></div>

        <div id="senhaGerada" class="alert alert-success mt-3 mb-0 text-center d-none">
          <div class="small">Sua senha</div>
          <div class="display-6 fw-bold" id="senhaCodigo"></div>
          <div id="senhaInfo"></div>
          <div class="small mt-1">Aguarde ser chamado no painel.</div>
        </div>
      </div>
    </div>

    <h2 class="h5 mb-2">Remédios disponíveis</h2>
    <input id="busca" type="text" class="form-control mb-3" placeholder="🔎 Buscar remédio..." />
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Remédio</th>
            <th>Categoria</th>
            <th class="text-center">Disponível</th>
          </tr>
        </thead>
        <tbody id="tabelaRemedios"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/portal.js"></script>
</body>
</html>
