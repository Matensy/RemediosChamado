<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmácia Popular - Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-success">
    <div class="container">
      <span class="navbar-brand">💊 Farmácia Popular</span>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Portal</a>
        <a class="nav-link" href="/painel">Painel</a>
        <a class="nav-link active" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 860px;">
    <h1 class="h4 mb-3">Dashboard de Estoque</h1>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <div class="text-muted small">Tipos de remédio</div>
            <div class="display-6 fw-bold" id="qtdRemedios">-</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <div class="text-muted small">Unidades em estoque</div>
            <div class="display-6 fw-bold" id="totalUnidades">-</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <div class="text-muted small">Acabando</div>
            <div class="display-6 fw-bold text-danger" id="qtdBaixos">-</div>
          </div>
        </div>
      </div>
    </div>

    <h2 class="h5 mb-3">Estoque por remédio</h2>
    <div id="listaEstoque"></div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
