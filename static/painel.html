<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmácia Popular - Painel</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-success">
    <div class="container">
      <span class="navbar-brand">💊 Farmácia Popular</span>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Portal</a>
        <a class="nav-link active" href="/painel">Painel</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 760px;">
    <div class="card shadow-sm text-center mb-3 painel-card">
      <div class="card-body py-5">
        <div class="text-muted">Senha chamada</div>
        <div id="senhaCodigo" class="painel-senha">---</div>
        <div id="senhaNome" class="h3 mb-1"></div>
        <div id="senhaRemedio" class="h5 text-muted"></div>
        <div id="senhaGuiche" class="badge bg-success fs-5 mt-2 d-none"></div>
      </div>
    </div>

    <div id="alertaEstoque" class="alert alert-warning text-center d-none"></div>

    <div class="d-flex justify-content-between align-items-center">
      <span class="text-muted">Aguardando na fila: <strong id="qtdFila">0</strong></span>
      <button id="btnChamar" class="btn btn-success btn-lg">Chamar próximo ▶</button>
    </div>
  </div>

  <script src="/js/painel.js"></script>
</body>
</html>
